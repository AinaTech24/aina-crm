# Production stack for the cheap single-box path (one EC2 instance).
#
#   web + worker + redis + caddy(auto-HTTPS)  all on one VM.
#   Postgres = managed RDS by default (durable, backed up).
#   For the absolute-cheapest "everything on one box", enable the on-box DB:
#       docker compose -f docker-compose.prod.yml --profile db-onbox up -d
#   (then point DATABASE_URL / APP_DATABASE_URL at postgres:5432)
#
# First run on the box:
#   1. put real values in  .env.production   (see .env.production.example)
#   2. set  APP_DOMAIN=app.yourfirm.com  in the shell or .env.production
#   3. docker compose -f docker-compose.prod.yml build
#   4. docker compose -f docker-compose.prod.yml run --rm web npm run migrate:all
#   5. docker compose -f docker-compose.prod.yml up -d
#
# Upgrade path: when one box isn't enough, the SAME image moves to ECS Fargate;
# Redis → ElastiCache, on-box Postgres → RDS. Nothing about the app changes.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are inlined at build time — read from the shell/.env.production
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL}
    image: mfd-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    depends_on:
      - redis

  worker:
    image: mfd-app:latest # reuses the image built by `web`
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["npm", "run", "worker:prod"]
    # The image's default HEALTHCHECK curls :3000 — correct for `web`, but the
    # worker runs no HTTP server, so disable it here (liveness = the process is
    # up; restart: unless-stopped already covers crash recovery).
    healthcheck:
      disable: true
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis_data:/data

  # Optional on-box Postgres for the rock-bottom tier (no RDS). Enable with:
  #   docker compose -f docker-compose.prod.yml --profile db-onbox up -d
  # NB: you own backups — pair with a nightly `pg_dump → S3` cron.
  postgres:
    image: postgres:16-alpine
    profiles: ["db-onbox"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: mfd
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mfd"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  pg_data:
