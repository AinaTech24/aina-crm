name: Image shadow build (no deploy)

# SHADOW ONLY. Builds the optimized app image on a GitHub-hosted STANDARD arm64
# runner, packages it, smoke-tests the exact image against throwaway Postgres and
# Redis containers, and reports size / time / memory numbers. It NEVER deploys:
#   - no `environment:` (so it cannot use the production AWS role),
#   - no AWS credentials, no id-token permission,
#   - no secrets are referenced at all.
# Production keeps using the existing deploy workflow until this has been proven.

on:
  workflow_dispatch:
    inputs:
      build_old:
        description: "Also build main's current Dockerfile as the size/time baseline"
        type: boolean
        default: false
  push:
    branches: [cost/slim-image]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - scripts/image-smoke.sh
      - scripts/image-shadow-measure.sh
      - .github/workflows/image-shadow.yml

permissions:
  contents: read

concurrency:
  group: image-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow:
    # `ubuntu-24.04-arm` is a standard hosted runner (not a larger runner).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_APP_URL: https://crm.ainatech.in
      NEXT_PUBLIC_SITE_URL: https://crm.ainatech.in
      NEXT_PUBLIC_S3_PUBLIC_URL: https://crm.ainatech.in
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build, package and measure (scripts/image-shadow-measure.sh)
        env:
          BUILD_OLD: ${{ inputs.build_old && '1' || '0' }}
        run: |
          git fetch origin main --depth=1 || true
          bash scripts/image-shadow-measure.sh 2>&1 | tee shadow.log
          exit "${PIPESTATUS[0]}"
      - name: Keep the packaged artifact (2 days) — NOT deployed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-image-${{ github.sha }}
          path: |
            out/image.tar.gz
            out/manifest.json
            shadow.log
          retention-days: 2
          if-no-files-found: warn
