name: CI

# Branches and pull requests only. A push to main is validated by the DEPLOY workflow (it calls
# the same ci-core.yml once and uses that result as the gate for building and deploying), so main
# is never checked twice. Docs-only pushes need no code checks. A newer push to the same branch
# cancels the superseded run (never a deploy: those live in deploy.yml and are never cancelled).
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['docs/**', '**/*.md', 'artifacts/**', 'reports/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'artifacts/**', 'reports/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/ci-core.yml
