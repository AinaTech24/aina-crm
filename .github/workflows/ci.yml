name: CI

# Run on EVERY branch, not just main/master. Day-to-day work happens on feature
# branches (feat/…) and this repo rarely opens PRs, so the old filter meant CI
# effectively never ran: the checks below — typecheck, RBAC gating, migration
# numbering, RLS coverage — only fired on branches nobody pushes to.
on:
  workflow_call:
  push:
  pull_request:

jobs:
  quality:
    name: Typecheck · RBAC · Calc · Tests
    runs-on: ubuntu-latest
    env:
      # `tsc --noEmit` over the whole app outgrew Node's default ~2 GB heap on
      # the runner (2026-10-01: "JavaScript heap out of memory" after ~2 min,
      # which failed verify and so skipped every deploy). A standard runner
      # has at least 7 GB; give the checks 6 GB of it.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: RBAC guard (every mutation route is capability/session gated)
        run: npm run check:rbac
      - name: Migration numbering guard (no new duplicate prefixes)
        run: npm run check:migrations
      - name: Calculator math assertions
        run: npm run check:calc
      - name: Hardcoded-color ratchet (shared components stay themeable)
        run: npm run check:colors
      - name: as-any ratchet (type-safety doesn't regress)
        run: npm run check:asany
      - name: Math-convention import guard (no file mixes nominal + effective)
        run: npm run check:mathimports
      - name: Unit tests (money math + central spine)
        run: npm test
      - name: Lint
        run: npm run lint

  mobile:
    name: Mobile types and regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand

  db-checks:
    name: Migrate · RLS coverage
    runs-on: ubuntu-latest
    # PostgreSQL and Redis run ON the runner, disposable, provisioned by
    # scripts/ci/provision-test-db.sh — not a service container. The RTA
    # development posting gate posts only to a database server on this machine
    # (inet_server_addr() must be loopback); a service container reports its
    # Docker address, so every posting test was refused (2026-10-14). The gate
    # is not relaxed. Two roles, random masked passwords, nothing from
    # production: ci_admin (test admin + migrations) and mfd_app (restricted
    # application role — RLS is enforced only for it). The script writes
    # DATABASE_URL / ADMIN_DATABASE_URL (ci_admin), TEST_DATABASE_URL and
    # APP_DB_PASSWORD (mfd_app) and TEST_REDIS_URL to the job environment.
    env:
      ALLOW_SYSTEM_TX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Provision a disposable PostgreSQL + Redis on the runner (test admin and restricted roles)
        run: bash scripts/ci/provision-test-db.sh
      - name: Apply migrations
        run: npm run migrate:all
      - name: RLS coverage guard (every tenant table has a policy)
        run: npm run check:rls
      - name: Provision the non-superuser app role (RLS is only enforced for it)
        run: node scripts/provision-app-role.mjs
      - name: DB-backed tests (RLS isolation · runtime role · RTA posting · share-token · webhook sigs)
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-db.json
      - name: No DB-backed test skipped (a skipped security or posting test is not a pass)
        if: always()
        run: node scripts/ci/assert-no-db-skips.mjs vitest-db.json
      - name: RTA emergency-shutdown drill (alone — it halts every firm in the database)
        run: npm run test:emergency
