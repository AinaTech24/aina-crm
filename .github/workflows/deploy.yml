name: Deploy to AWS (EC2)

# Ships the checked-out tree to the EC2 box and runs the blue-green deploy
# script that already lives there (~/run-deploy.sh): prune → build → migrate →
# schema guard → start the idle colour → health-check → stop the old colour.
# A failed deploy leaves the previous colour serving, so it cannot take the
# site down.
#
# Transport (2026-10-07): GitHub OIDC → IAM role aina-crm-github-deploy →
# S3 (release tarball) + SSM Run Command → the instance. No SSH and no
# long-lived AWS keys in GitHub. The role trusts ONLY this repo's
# `production` environment (deployable from main and deploy/aws), may upload
# only to the deploy-artifacts bucket's releases/ prefix, and may run only
# AWS-RunShellScript on the production instance. On the box,
# scripts/ssm-deploy.sh (taken from the tarball) does what the SSH step did.
#
# NOTE ON .env: the box owns its own ~/app/.env and .env.production. This
# workflow never reads or writes them, so production secrets stay on the box.

on:
  push:
    # main is the deploy branch: merging to main ships. deploy/aws is kept for
    # pinning a deploy to a specific commit without moving main.
    branches: [main, deploy/aws]
  workflow_dispatch:

concurrency:
  # Two deploys at once fight over the Docker build and the blue/green state
  # file. Queue them instead of cancelling — a half-finished deploy is worse
  # than a slow one.
  group: deploy-aws
  cancel-in-progress: false

jobs:
  # Run the same safety checks against the exact revision being deployed.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # The IAM role trusts only tokens for this environment, which only main and
    # deploy/aws may use (Settings → Environments → production).
    environment: production
    permissions:
      id-token: write   # GitHub OIDC token for the AWS role
      contents: read
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-059673ee0da4f877a
      ARTIFACT_BUCKET: aina-crm-deploy-artifacts-972971302420
      DEPLOY_ROLE: arn:aws:iam::972971302420:role/aina-crm-github-deploy
    steps:
      - uses: actions/checkout@v4

      # The box holds a plain source tree (NOT a git checkout), so we ship the
      # tree rather than pulling on the far side.
      - name: Package the tree
        run: |
          tar czf app.tgz \
            --exclude='node_modules' --exclude='.next' --exclude='.git' \
            src public drizzle scripts \
            package.json package-lock.json next.config.ts tsconfig.json \
            drizzle.config.ts postcss.config.js tailwind.config.ts \
            vitest.config.ts
          ls -lh app.tgz

      - name: AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          role-session-name: gh-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the release
        run: |
          echo "RELEASE_KEY=releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.tgz" >> "$GITHUB_ENV"
          aws s3 cp app.tgz "s3://${ARTIFACT_BUCKET}/releases/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}.tgz" --only-show-errors

      # One SSM command does the whole deploy and waits for it (like the SSH
      # step did): download the tarball with the INSTANCE role, take
      # scripts/ssm-deploy.sh from it, run it as ec2-user. ssm-deploy.sh holds
      # ~/.deploy.lock for the duration, so deploys never overlap on the box.
      - name: Deploy (blue-green) via SSM and wait for the result
        run: |
          set -euo pipefail
          params=$(jq -n --arg uri "s3://${ARTIFACT_BUCKET}/${RELEASE_KEY}" '{
            executionTimeout: ["3300"],
            commands: [
              "set -euo pipefail",
              ("aws s3 cp \"" + $uri + "\" /tmp/app.tgz --only-show-errors --region ap-south-1"),
              "chown ec2-user:ec2-user /tmp/app.tgz",
              "tar xzf /tmp/app.tgz -O scripts/ssm-deploy.sh > /tmp/ssm-deploy.sh",
              "chmod 755 /tmp/ssm-deploy.sh",
              "runuser -l ec2-user -c \"bash /tmp/ssm-deploy.sh /tmp/app.tgz\""
            ]
          }')
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub deploy run ${GITHUB_RUN_ID} ${GITHUB_SHA::8}" \
            --timeout-seconds 600 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"

          status=Pending
          for _ in $(seq 1 220); do   # up to ~55 min
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tail -40 || true
          if [ "$status" != "Success" ]; then
            echo "::error::Deploy did not succeed (SSM status: $status). The previous colour is still serving."
            exit 1
          fi
